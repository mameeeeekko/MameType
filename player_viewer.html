<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Viewer</title>
<style>
body { background:#1a1a1a; color:#f0f0f0; font-family:sans-serif; margin:0; padding:20px; }
h1 { text-align:center; color:#88b; }
#container { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:20px; padding:20px; }
.card { background:#2a2a2e; border:1px solid #444; border-radius:8px; padding:10px; display:flex; flex-direction:column; align-items:center; }
canvas { background:#111; border-radius:4px; }
.name { margin-top:10px; font-size:14px; font-family:monospace; }
</style>
</head>
<body>
<h1>Player Viewer</h1>
<div id="container"></div>
<canvas id="enemyModeCanvas" style="display:none;"></canvas>
<canvas id="defenseModeCanvas" style="display:none;"></canvas>
<script type="module" src="./js/player_viewer.js"></script>
</body>
</html>
