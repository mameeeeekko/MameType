<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enemy Shape Viewer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #88b;
        }
        #shape-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .shape-card {
            background-color: #2a2a2e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .shape-card canvas {
            background-color: #111;
            border-radius: 4px;
        }
        .shape-name {
            margin-top: 10px;
            font-size: 14px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Enemy Shape Viewer</h1>
    <div id="shape-container"></div>

    <script type="module" src="./js/shape_viewer.js"></script>
</body>
</html>
